name: Quality Gate

# يفرض docs/11-DEFINITION-OF-DONE.md بقدر ما يمكن أتمتته (§5 من ذلك الملف).
# راجع docs/12-SECURITY-REMEDIATION.md §4 وdocs/13-TEST-STRATEGY.md §6 للمرجع الكامل لكل فحص.
#
# قرار الفريق (13-TEST-STRATEGY.md §6): الفحوص الجديدة تبدأ "تحذيرية" لأسبوع واحد
# (continue-on-error: true) ثم تصبح مانعة. راجع تاريخ هذا الملف — إن مضى أسبوع
# على أول تشغيل ناجح، أزل `continue-on-error` من الخطوات المعلَّمة "GRACE-PERIOD".
#
# استثناء محسوم (UNIT30.3): حراس SEC-05/07/08/10/11 صارت فحوص AST مانعة بلا
# فترة سماح بعد أن أثبت التدقيق أن أنماط grep القديمة كانت تطابق تعليقات
# توثيقية (لا كوداً تنفيذياً). لا تُعاد إلى grep ولا تُضاف لها استثناءات.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- G2: الأنواع + سقف any (docs/11 §G2) ----
      - name: TypeScript — no emit
        run: npx tsc --noEmit

      - name: any-count ratchet (baseline 310, must not increase)
        run: |
          COUNT=$(grep -rho ': any\|as any' src --include=*.ts | wc -l)
          echo "any usages: $COUNT (baseline: 310)"
          if [ "$COUNT" -gt 310 ]; then
            echo "::error::any usage increased from baseline 310 to $COUNT — see docs/11-DEFINITION-OF-DONE.md G2"
            exit 1
          fi

      # ---- G1: البناء ----
      - name: Build
        run: npm run build

      # ---- فحوص أمنية نمطية (docs/12-SECURITY-REMEDIATION.md §4) ----
      # SEC-06 is AST-based: flags executable Math.random() only — direct,
      # multi-line, parenthesized, static element access, alias + later call,
      # deferred references — while comments/strings/types never match.
      # Missing inputs fail closed, never PASS.
      - name: SEC-06 — no Math.random() in security-sensitive code
        run: node dev-tools/check-sec06-math-random.mjs

      # ---- SEC-05/07/08/10/11 — AST guards (UNIT30.3, BLOCKING) ----
      # These replace the old grep steps. The old patterns matched explanatory
      # documentation (SEC-05 matched `main.ts`'s comment about cors(); SEC-10
      # matched the worker header explaining why this.sockets is banned), so
      # they could not block. The AST checker inspects executable syntax only:
      # comments, string examples and inactive realtime preparation never
      # match, while missing inputs fail closed. The old SEC-07/08/11 steps
      # were GRACE-PERIOD warnings; they are now blocking with no exemption.
      - name: SEC-05 — CORS must use an allow-list (blocking AST)
        run: node dev-tools/check-sec-guards.mjs sec05

      - name: SEC-07 — single canonical session key (blocking AST)
        run: node dev-tools/check-sec-guards.mjs sec07

      - name: SEC-08 — no JavaScript-readable session secret (blocking AST)
        run: node dev-tools/check-sec-guards.mjs sec08

      - name: SEC-10 — Durable Object hibernation-safe sockets (blocking AST)
        run: node dev-tools/check-sec-guards.mjs sec10

      - name: SEC-11 — no query-string session token (blocking AST)
        run: node dev-tools/check-sec-guards.mjs sec11

      # Behavioral counterpart to the static guards: the AST proves a banned
      # construct is absent; these suites prove the intended property still
      # holds (CORS allow-list, legacy session_id ignored, HttpOnly + CSRF +
      # Bearer contract, authoritative 401 vs transient 5xx, SSE tickets,
      # hibernation-safe broadcast). Blocking, with no exception.
      - name: SEC-05/07/08/10 regression suites (blocking)
        run: |
          npx vitest run \
            tests/api/sec-guards.test.ts \
            tests/api/sec08-httponly-session.test.ts \
            tests/api/auth-session-transient.test.ts \
            tests/api/sse-user-auth.test.ts \
            tests/ui/sec07-session-consumers.test.ts \
            tests/ui/sec08-no-js-session.test.ts \
            tests/client/session-access.test.ts \
            tests/ui/auth-session-lifecycle.test.ts \
            tests/workers/sec10-realtime.test.ts

      # ---- G5: سلامة قاعدة البيانات — ترحيل من قاعدة فارغة ----
      - name: Migrate D1 from empty database (GRACE-PERIOD — needs wrangler auth setup)
        continue-on-error: true
        run: |
          npm run db:reset

      # ---- الاختبارات الآلية (عند وجودها) ----
      - name: Unit + integration tests
        run: |
          if [ -f "vitest.config.ts" ] || [ -d "tests" ]; then
            npx vitest run || (echo "::error::tests failed" && exit 1)
          else
            echo "::warning::no tests/ directory yet — see docs/13-TEST-STRATEGY.md §8 (week-1 plan)"
          fi

      # ---- npm audit (إنتاج فقط) — UNIT33.1 blocking gate ----
      - name: npm audit — production deps, high severity (blocking)
        run: node dev-tools/check-audit-exceptions.mjs

      # ---- جرد المسارات — يعيد التوليد ويكشف UNGUARDED (تحذيري دوماً، انظر docs/13 §6) ----
      - name: Regenerate route inventory
        continue-on-error: true
        run: |
          node dev-tools/route-inventory.mjs
          UNGUARDED=$(grep -c "UNGUARDED" docs/14-ROUTE-INVENTORY.md || true)
          echo "::warning::$UNGUARDED route(s) classified UNGUARDED — review against docs/12-SECURITY-REMEDIATION.md SEC-13"

      # ---- مراجع وثائق مفقودة ----
      - name: Check for dangling doc references (GRACE-PERIOD)
        continue-on-error: true
        run: |
          MISSING=0
          for f in $(grep -rhoE 'docs/[A-Za-z0-9_.-]+\.md' docs AGENTS.md README.md 2>/dev/null | sort -u); do
            if [ ! -f "$f" ]; then
              echo "::warning::referenced doc missing: $f"
              MISSING=1
            fi
          done
          exit 0
