name: Deploy to Cloudflare Pages

# cloudflare/pages-action@v1 is no longer resolvable
# ("Unable to resolve action, not found"), which stalled production deploys.
# This workflow uses Cloudflare's own Wrangler CLI (already a devDependency,
# so the deploy mechanism is pinned to the repo, not to a third-party action).
# Same semantics as before: same Pages project (project-8e7c178d, also the
# `name` in wrangler.jsonc), same build output (dist, also
# `pages_build_output_dir` in wrangler.jsonc), production on push to main,
# preview deployments for PRs / other branches. Same secrets — no new ones:
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # R-RELEASE-1-REM1 release gate: deploy runs ONLY after the Quality Gate
  # workflow concludes `success` for the SAME commit AND SAME event.
  # Read-only API polling (no test suite rerun here — the suite already ran
  # in Quality Gate). A single immediate poll is NOT enough: on push, this
  # workflow starts at the same time as Quality Gate, so "not completed yet"
  # (or "no run yet") must WAIT, not fail. PRs resolve their head SHA (runs
  # are keyed by head); pushes use github.sha.
  quality-gate-check:
    runs-on: ubuntu-latest
    name: Quality Gate passed for this SHA
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Quality Gate success on this SHA+event
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SHA="$PR_HEAD_SHA"
            EXPECTED_EVENT="pull_request"
          else
            SHA="$GITHUB_SHA"
            EXPECTED_EVENT="push"
          fi
          TIMEOUT_SECONDS=1800
          INTERVAL_SECONDS=30
          DEADLINE=$(( $(date +%s) + TIMEOUT_SECONDS ))
          echo "Waiting up to ${TIMEOUT_SECONDS}s for Quality Gate (event=$EXPECTED_EVENT) on SHA $SHA ..."
          while true; do
            STATE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality-gate.yml \
              --commit "$SHA" --event "$EXPECTED_EVENT" --limit 1 \
              --json status,conclusion,url \
              --jq 'if length == 0 then "NO_RUN" else "\(.[0].status) \(.[0].conclusion // "-") \(.[0].url)" fi')
            STATUS="${STATE%% *}"
            REST="${STATE#* }"
            CONCLUSION="${REST%% *}"
            URL="${REST#* }"
            NOW=$(date +%s)
            if [ "$STATUS" = "completed" ]; then
              echo "Quality Gate run: $URL -> conclusion=$CONCLUSION"
              if [ "$CONCLUSION" = "success" ]; then
                echo "Quality Gate succeeded for $SHA — deploy unblocked (R-RELEASE-1-REM1)"
                exit 0
              fi
              echo "::error::Quality Gate concluded '$CONCLUSION' for SHA $SHA ($URL) — deploy blocked (R-RELEASE-1-REM1)"
              exit 1
            fi
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for Quality Gate (event=$EXPECTED_EVENT) on SHA $SHA (last state: $STATE) — deploy blocked (R-RELEASE-1-REM1)"
              exit 1
            fi
            echo "Quality Gate not completed yet (state: $STATE) — rechecking in ${INTERVAL_SECONDS}s ..."
            sleep "$INTERVAL_SECONDS"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    needs: [quality-gate-check]
    permissions:
      contents: read
    env:
      # R-RELEASE-1-REM1: `secrets` is not an allowed context in `if:`
      # (actionlint: context "secrets" is not allowed here — allowed: env,
      # github, inputs, job, matrix, needs, runner, steps, strategy, vars).
      # Project the presence bit to job env once; steps test `env.` instead.
      # The secret value itself is never printed nor interpolated into run:.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # R-RELEASE-1 bindings isolation gate (fail-closed, read-only):
      # production must resolve exactly the pinned production D1, and preview
      # must resolve ZERO D1 (no authorized preview D1 exists — a preview
      # inheriting production D1 never deploys). Runs before either deploy.
      - name: Verify production bindings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node dev-tools/check-pages-bindings.mjs --target=production

      - name: Verify preview bindings isolation
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: node dev-tools/check-pages-bindings.mjs --target=preview

      # R-RELEASE-1 production schema-readiness gate (READ-ONLY collection +
      # manifest evaluation). Collects applied migrations, the pending list and
      # the required-schema snapshot with read-only wrangler calls, then FAILS
      # closed on: required pending / changed applied migration / missing
      # schema / read failure / unknown target / unexpected pending (recorded,
      # never auto-applied). NEVER applies migrations here — preparation and
      # authorized apply live in docs/19-RELEASE-RUNBOOK.md only.
      - name: Collect production schema state (read-only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx wrangler d1 migrations list dueli-db --remote > /tmp/readiness-list.txt
          npx wrangler d1 execute dueli-db --remote --json --command "SELECT name FROM d1_migrations ORDER BY rowid;" > /tmp/readiness-applied.json
          TABLES=$(node -e "console.log(Object.keys(require('./dev-tools/release-schema-manifest.json').required_schema.tables).join(' '))")
          {
            echo '{"tables": {'
            FIRST=1
            for T in $TABLES; do
              COLS=$(npx wrangler d1 execute dueli-db --remote --json --command "SELECT name FROM pragma_table_info('$T') ORDER BY cid;" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify(j[0].results.map(r=>r.name)))})")
              if [ "$FIRST" -eq 1 ]; then FIRST=0; else echo ','; fi
              printf '"%s": %s' "$T" "$COLS"
            done
            echo '}, "indexes": '
            npx wrangler d1 execute dueli-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='index' AND tbl_name IN ('explore_result_sessions','explore_result_chunks');" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify(j[0].results.map(r=>r.name)))})"
            echo '}'
          } > /tmp/readiness-schema.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Evaluate release schema readiness (fail-closed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APPLIED=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/readiness-applied.json','utf8'));console.log(JSON.stringify((j[0]&&j[0].results||[]).map(r=>r.name)))")
          node dev-tools/check-release-readiness.mjs \
            --target=project-8e7c178d \
            --database=dueli-db \
            --sha="$RELEASE_SHA" \
            --applied="$APPLIED" \
            --pending-text="$(cat /tmp/readiness-list.txt)" \
            --schema="$(cat /tmp/readiness-schema.json)"
        env:
          RELEASE_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist --project-name=project-8e7c178d --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fork PRs have no production secrets: stop safely before any
      # secret-consuming step (build above runs secret-free).
      - name: Deploy preview to Cloudflare Pages
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: npx wrangler pages deploy dist --project-name=project-8e7c178d --branch="$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Deployment Status
        run: echo "✅ Deployment completed successfully!"
